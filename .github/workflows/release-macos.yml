name: Release (macOS desktop)

# Builds the macOS desktop installers (Openship-arm64.dmg and Openship-x64.dmg) for a
# release that the Release workflow (release.yml) already published, and attaches them
# to it. Split out of release.yml so a version tag never starts a Mac build on its own.
#
# Runs only on Marcelo's Mac (self-hosted runner label marcelo-mac): a one-job runner
# that gh-mac-build starts after he approves that run. Manual only, and the workflow
# stays disabled in GitHub between approved runs (OPENCLAW_MAC_BUILDS_ON_MARCELO_MAC_20261118).
# Nothing may stay behind on his Mac: temporary files go under $RUNNER_TEMP, tools under
# the runner tool cache, never his home folder or Homebrew.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) whose GitHub release gets the dmgs
        required: true

concurrency:
  group: release-macos-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-desktop-macos:
    name: Build desktop installers (macOS arm64 + x64)
    runs-on: [self-hosted, macOS, ARM64, marcelo-mac]
    timeout-minutes: 90
    # Apple signing/notarization creds (repo secrets). All optional: when unset,
    # the signing + notarization steps below are skipped and the build is
    # unsigned (same as before). See forge.config.js osxSign.
    env:
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: The GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null

      - name: Read bun version
        id: bun-version
        shell: bash
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      # Not oven-sh/setup-bun: it installs into ~/.bun on the Mac. Bun and its package
      # cache live in the runner tool cache instead (kept between runs).
      - name: Setup Bun
        shell: bash
        env:
          BUN_VERSION: ${{ steps.bun-version.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TOOL_CACHE/bun/$BUN_VERSION"
          if [[ ! -x "$dir/bun" ]]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-aarch64.zip" -o "$RUNNER_TEMP/bun.zip"
            unzip -q -j -o "$RUNNER_TEMP/bun.zip" bun-darwin-aarch64/bun -d "$dir"
            ln -sf bun "$dir/bunx"
          fi
          "$dir/bun" --version
          echo "$dir" >> "$GITHUB_PATH"
          {
            echo "BUN_INSTALL=$RUNNER_TEMP/bun-home"
            echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TOOL_CACHE/bun-install-cache"
          } >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Import the Developer ID cert into a throwaway keychain so `electron-forge
      # make` can sign (osxSign in forge.config.js activates when APPLE_IDENTITY
      # is set). Skipped entirely when the secret is absent → unsigned build.
      - name: Import Apple signing certificate
        if: env.APPLE_IDENTITY != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/openship-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so codesign resolves the identity.
          # The last step deletes it; the runner also restores Marcelo's search list.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # A single Apple-Silicon runner builds both dmgs: bun --compile --target
      # cross-compiles the x64 API binary and electron-packager fetches x64
      # Electron, so we don't depend on scarce macos-13 (Intel) runners.
      - name: Build macOS dmgs (arm64 + x64)
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          bun run build
          bunx electron-forge make --arch=arm64
          bunx electron-forge make --arch=x64

      # Sign the disk image itself, then notarize + staple. notarytool scans the
      # DMG contents so the signed app inside is notarized too; signing the DMG
      # (not just the app) makes Gatekeeper's open-assessment on the downloaded
      # image pass cleanly, and stapling attaches the ticket for offline checks.
      # Gated on APPLE_ID (the notary credential), separate from signing: set
      # APPLE_IDENTITY only → signed-but-not-notarized (downloads still warn);
      # add APPLE_ID/PASSWORD/TEAM_ID → clean notarized download.
      - name: Sign, notarize + staple DMGs
        if: env.APPLE_ID != ''
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            dmg="apps/desktop/out/make/Openship-${arch}.dmg"
            echo "▸ signing ${dmg}"
            codesign --force --timestamp --sign "$APPLE_IDENTITY" "${dmg}"
            echo "▸ notarizing ${dmg}"
            xcrun notarytool submit "${dmg}" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "${dmg}"
            xcrun stapler validate "${dmg}"
          done

      - name: Collect dmgs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 x64; do
            src="apps/desktop/out/make/Openship-${arch}.dmg"
            if [[ ! -f "${src}" ]]; then
              echo "Missing ${src}"; ls -R apps/desktop/out/make || true; exit 1
            fi
            cp "${src}" "dist/Openship-${arch}.dmg"
            ( cd dist && shasum -a 256 "Openship-${arch}.dmg" > "Openship-${arch}.dmg.sha256" )
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: |
            dist/Openship-arm64.dmg
            dist/Openship-arm64.dmg.sha256
            dist/Openship-x64.dmg
            dist/Openship-x64.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Attach the dmgs to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            gh release upload "${TAG}" "dist/Openship-${arch}.dmg" "dist/Openship-${arch}.dmg.sha256" \
              --clobber --repo "${GITHUB_REPOSITORY}"
          done

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/openship-signing.keychain-db" 2>/dev/null || true
